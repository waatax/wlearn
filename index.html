<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>WLearn</title>
    <link rel="manifest" href="/wlearn/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WLearn" />
    <link rel="apple-touch-icon" href="/wlearn/logo.png" />
    <meta name="theme-color" content="#2d6648" />
    <script>
      // GitHub Pages SPA route restoration
      (function() {
        var search = window.location.search;
        if (search.indexOf('route=') !== -1) {
          var match = search.match(/route=([^&]*)/);
          if (match && match[1]) {
            var route = decodeURIComponent(match[1]);
            window.history.replaceState(null, null, '/wlearn/' + route);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
